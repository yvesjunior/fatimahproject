services:

  fatimaproject_web:
    container_name: fatimaproject_prod
    image: fatimaproject:prod
    ports:
      - "${WEB_PORT}:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - TRUSTED_PROXIES=*
      - FORCE_HTTPS=true
      - SESSION_SECURE_COOKIE=true
      - SESSION_DOMAIN=${SESSION_DOMAIN}
      # Default deploy file: connects to an EXTERNAL (managed/host) PostgreSQL —
      # there is no DB container here. For local development with a bundled
      # Postgres container, use `docker compose -f docker-compose.dev.yml`.
      # Set DB_HOST to the managed instance, or host.docker.internal when Postgres
      # runs on the host VM (host-gateway alias is provided below).
      - DB_CONNECTION=pgsql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSLMODE=${DB_SSLMODE:-prefer}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_SOURCE_PATH}/src/web/data:/var/www/html
      - fatimaproject_storage:/var/www/html/storage/app/public
    restart: always

volumes:
  fatimaproject_storage:
